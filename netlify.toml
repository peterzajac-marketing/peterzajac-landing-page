# Web beží pod base cestou /financne-a-investicne-poradenstvo (astro.config.mjs),
# preto sa build vnára do rovnakého podpriečinka — inak by assety vracali 404.
# robots.txt musí ostať na roote domény.
[build]
  command = "npm run build && rm -rf publish && mkdir -p publish/financne-a-investicne-poradenstvo && cp -R dist/. publish/financne-a-investicne-poradenstvo/ && cp dist/robots.txt publish/robots.txt"
  publish = "publish"

# Root domény presmeruje na landing page
[[redirects]]
  from = "/"
  to = "/financne-a-investicne-poradenstvo/"
  status = 301
